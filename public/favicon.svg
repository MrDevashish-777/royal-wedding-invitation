<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#F5C038"/>
      <stop offset="70%" stop-color="#D49B22"/>
      <stop offset="100%" stop-color="#9E6B0D"/>
    </linearGradient>
    <radialGradient id="rubyCenter" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#9E1428"/>
      <stop offset="65%" stop-color="#660A18"/>
      <stop offset="100%" stop-color="#3D030C"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Solid Vibrant Gold Base Circle -->
  <circle cx="96" cy="96" r="95" fill="url(#goldRim)"/>

  <!-- Inner Ruby Silk Medallion -->
  <circle cx="96" cy="96" r="82" fill="url(#rubyCenter)" stroke="#FFF2A3" stroke-width="3"/>
  <circle cx="96" cy="96" r="74" fill="none" stroke="#F5C038" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.8"/>

  <!-- Auspicious Sacred Diya / Kalash Flame at top -->
  <path d="M96 30 C90 44 82 54 96 68 C110 54 102 44 96 30 Z" fill="#FFC107" stroke="#FFFDE7" stroke-width="2" filter="url(#goldGlow)"/>
  <circle cx="96" cy="52" r="5" fill="#FFF9C4"/>

  <!-- Centerpiece: Royal Monogram Y & K in bold typography -->
  <!-- Letter Y -->
  <text x="96" y="124" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="44" 
        font-weight="900" 
        fill="url(#goldRim)" 
        stroke="#4A050F" 
        stroke-width="1.5"
        text-anchor="middle" 
        filter="url(#goldGlow)"
        letter-spacing="2">
    Y &amp; K
  </text>

  <!-- Small auspicious star / decorative diamond below -->
  <polygon points="96,140 100,146 96,152 92,146" fill="#FFF2A3"/>
  <line x1="68" y1="146" x2="88" y2="146" stroke="#F5C038" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="146" x2="124" y2="146" stroke="#F5C038" stroke-width="1.5" stroke-linecap="round"/>
</svg>
